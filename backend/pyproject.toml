[project]
name = "nexus-backend"
version = "0.1.0"
description = "NEXUS - Enterprise Multi-Agent Incident Resolution & AI Operations Platform (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.6",
    "greenlet>=3.1.1",
    "redis>=5.1.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "python-jose[cryptography]>=3.3.0",
    # passlib 1.7.4 (latest) predates bcrypt's 4.1+ API changes (it removed
    # `__about__`, which passlib's version-detection code reads) — this
    # combination raises `AttributeError: module 'bcrypt' has no attribute
    # '__about__'` and then a confusing secondary "password cannot be
    # longer than 72 bytes" error on first hash(). Pinning bcrypt below 4.1
    # is the standard fix until passlib cuts a release that supports newer
    # bcrypt (tracked upstream: https://foss.heptapod.net/python-libs/passlib/-/issues/183).
    "bcrypt>=4.0.1,<4.1",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "black>=24.10.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
